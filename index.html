<!DOCTYPE html>

<head>
<meta charset="UTF-8" />

<title>VAM Services Calculator</title>
<style>
:root{
  --bg:#f4f6f8; --card:#fff; --black:#111827; --muted:#6b7280;
  --line:#e5e7eb; --green:#ecfdf5; --blue:#eff6ff;
}
body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:#111827;padding:18px}
.container{max-width:1200px;margin:auto}
.header{background:#111;color:#fff;padding:24px;border-radius:18px;margin-bottom:18px}
.header h1{margin:0;font-size:30px}
.header p{margin:8px 0 0;color:#cbd5e1}
.card{background:var(--card);border-radius:16px;margin-bottom:14px;box-shadow:0 3px 14px rgba(0,0,0,.08);overflow:hidden}
.title{padding:18px 20px;font-size:21px;font-weight:700;display:flex;justify-content:space-between;cursor:pointer}
.content{display:none;padding:0 18px 18px}
.row{display:grid;grid-template-columns:2.3fr .75fr .65fr .85fr .85fr .85fr 1fr 1fr;gap:8px;align-items:center;border-top:1px solid var(--line);padding:10px 0}
.head{font-size:12px;font-weight:700;color:#4b5563;text-transform:uppercase}
.item-title{font-weight:700}
.item-ru{font-size:12px;color:var(--muted);margin-top:3px}
input,select{width:100%;box-sizing:border-box;border:1px solid #d1d5db;border-radius:8px;padding:9px;font-size:14px;background:#fff}
.price{font-size:13px;color:#374151}
.sum{font-weight:700}
.total{background:var(--green);border:1px solid #bbf7d0;border-radius:12px;padding:14px;margin-top:14px;font-size:22px;font-weight:800}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.badge{display:inline-block;background:var(--blue);padding:4px 8px;border-radius:999px;font-size:12px;color:#1d4ed8;margin-top:6px}
@media(max-width:850px){
  .row{grid-template-columns:1fr 1fr}
  .head{display:none}
}
</style>
</head>

function money(n){return "$"+Math.round(n).toLocaleString();}
function priceByLevel(level, low, working, high){
  if(level==="low") return low;
  if(level==="high") return high;
  return working;
}
function toggle(id){
  const el=document.getElementById(id);
  el.style.display=el.style.display==="block"?"none":"block";
}

function renderApp(){
  const app=document.getElementById("app");
  app.innerHTML="";
  sections.forEach(sec=>{
    app.innerHTML+=`
    <div class="card">
      <div class="title" onclick="toggle('${sec.id}')">${sec.title}<span>+</span></div>
      <div id="${sec.id}" class="content">${renderSection(sec)}</div>
    </div>`;
  });
}

function renderSection(sec){
  if(sec.type==="exterior") return renderExterior(sec.id);
  if(sec.type==="cabinets") return renderCabinets(sec.id);

  let html=`
  <div class="row head">
    <div>Description</div><div>Qty</div><div>Unit</div><div>Low</div><div>Working</div><div>High</div><div>Select</div><div>Total</div>
  </div>`;
  sec.items.forEach((r,i)=>{
    html+=`
    <div class="row">
      <div><div class="item-title">${r[0]}</div><div class="item-ru">${r[1]}</div></div>
      <div><input type="number" id="${sec.id}_${i}_qty" value="0" min="0" step="0.01" oninput="calcTable('${sec.id}')"></div>
      <div class="price">${r[2]}</div>
      <div class="price">${money(r[3])}</div>
      <div class="price">${money(r[4])}</div>
      <div class="price">${money(r[5])}</div>
      <div><select id="${sec.id}_${i}_level" onchange="calcTable('${sec.id}')">
        <option value="working">Working</option>
        <option value="low">Low</option>
        <option value="high">High</option>
      </select></div>
      <div class="sum" id="${sec.id}_${i}_sum">$0</div>
    </div>`;
  });
  html+=`<div class="total" id="${sec.id}_total">Grand Total: $0</div>
  <div class="note">Preliminary estimate only. Final price depends on photos, access, materials, and site conditions.</div>`;
  return html;
}

function calcTable(secId){
  const sec=sections.find(s=>s.id===secId);
  let total=0;

  sec.items.forEach((r,i)=>{
    let qty=parseFloat(document.getElementById(`${secId}_${i}_qty`).value)||0;
    let lvl=document.getElementById(`${secId}_${i}_level`).value;
    let price=priceByLevel(lvl,r[3],r[4],r[5]);
    let line=qty*price;
    document.getElementById(`${secId}_${i}_sum`).innerText=money(line);
    total+=line;
  });

  if(sec.minimum && total>0 && total<sec.minimum) total=sec.minimum;
  if(secId==="drywall" && total>0 && total<200) total=200;
  if(secId==="deck" && total>0 && total<250) total=250;

  document.getElementById(`${secId}_total`).innerText="Grand Total: "+money(total);
}

function drywallDiscount(qty){
  if(qty>=10) return 0.75;
  if(qty>=6) return 0.80;
  if(qty>=3) return 0.90;
  return 1;
}

/* override drywall calculation with volume discount */
function calcDrywall(){
  const secId="drywall";
  const sec=sections.find(s=>s.id===secId);
  let total=0;

  sec.items.forEach((r,i)=>{
    let qty=parseFloat(document.getElementById(`${secId}_${i}_qty`).value)||0;
    let lvl=document.getElementById(`${secId}_${i}_level`).value;
    let price=priceByLevel(lvl,r[3],r[4],r[5]);

    if(i===0 || i===1 || i===2) price*=drywallDiscount(qty);

    let line=qty*price;
    document.getElementById(`${secId}_${i}_sum`).innerText=money(line);
    total+=line;
  });

  if(total>0 && total<200) total=200;
  document.getElementById(`${secId}_total`).innerText="Grand Total: "+money(total);
}

/* replace drywall event after render */
function attachDrywallEvents(){
  const sec=sections.find(s=>s.id==="drywall");
  sec.items.forEach((r,i)=>{
    document.getElementById(`drywall_${i}_qty`).setAttribute("oninput","calcDrywall()");
    document.getElementById(`drywall_${i}_level`).setAttribute("onchange","calcDrywall()");
  });
}

function cabRow(id,i,en,ru,unit,low,working,high){
return `
<div class="row">
  <div><div class="item-title">${en}</div><div class="item-ru">${ru}</div></div>
  <div><input type="number" id="cab_${i}_qty" value="0" min="0" step="1" oninput="calcCabinets()"></div>
  <div class="price">${unit}</div>
  <div class="price">${money(low)}</div><div class="price">${money(working)}</div><div class="price">${money(high)}</div>
  <div><select id="cab_${i}_level" onchange="calcCabinets()">
    <option value="working">Working</option><option value="low">Low</option><option value="high">High</option>
  </select></div>
  <div class="sum" id="cab_${i}_sum">$0</div>
</div>`;
}

function calcCabinets(){
  let base=0;

  const rows=[
    {i:0,low:60,working:90,high:135},
    {i:1,low:50,working:70,high:110}
  ];

  rows.forEach(r=>{
    let qty=+document.getElementById(`cab_${r.i}_qty`).value||0;
    let lvl=document.getElementById(`cab_${r.i}_level`).value;
    let price=priceByLevel(lvl,r.low,r.working,r.high);
    let line=qty*price;
    document.getElementById(`cab_${r.i}_sum`).innerText=money(line);
    base+=line;
  });

  let frameLvl=document.getElementById("cab_frame_level").value;
  let frameQty=+document.getElementById("cab_frame_qty").value||0;
  let framePct=priceByLevel(frameLvl,.25,.30,.40);
  let frameTotal=frameQty>0 ? base*framePct : 0;
  document.getElementById("cab_frame_sum").innerText=money(frameTotal);

  let sandLvl=document.getElementById("cab_sand_level").value;
  let sandQty=+document.getElementById("cab_sand_qty").value||0;
  let sandPct=priceByLevel(sandLvl,.10,.15,.25);
  let sandTotal=sandQty>0 ? base*sandPct : 0;
  document.getElementById("cab_sand_sum").innerText=money(sandTotal);

  let caulkLvl=document.getElementById("cab_caulking_level").value;
  let caulkQty=+document.getElementById("cab_caulking_qty").value||0;
  let caulkPct=priceByLevel(caulkLvl,.05,.10,.15);
  let caulkTotal=caulkQty>0 ? base*caulkPct : 0;
  document.getElementById("cab_caulking_sum").innerText=money(caulkTotal);

  let repairQty=+document.getElementById("cab_repair_qty").value||0;
  let repairLvl=document.getElementById("cab_repair_level").value;
  let repairPrice=priceByLevel(repairLvl,25,50,100);
  let repairTotal=repairQty*repairPrice;
  document.getElementById("cab_repair_sum").innerText=money(repairTotal);

  let total=base+frameTotal+sandTotal+caulkTotal+repairTotal;
  if(total>0 && total<1500) total=1500;

  document.getElementById("cabinets_total").innerText="Grand Total: "+money(total);
}

${extFixedRow("Foundation Painting","Покраска фундамента","Project",300,600,1200,"foundation")}
${extFixedRow("Downspout Painting","Покраска сливной трубы","Each",80,120,150,"downspout")}

<div class="total" id="exterior_total">Grand Total: $0</div>
<div class="note">Pressure washing is included in exterior painting base price. Gutters are included with trim color unless specified separately.</div>
`;
}

function extBaseRow(en,ru,unit,low,working,high,key){
return `
<div class="row">
  <div><div class="item-title">${en}</div><div class="item-ru">${ru}</div></div>
  <div><input type="number" id="ext_${key}_qty" value="0" min="0" step="1" oninput="calcExterior()"></div>
  <div class="price">${unit}</div>
  <div class="price">${money(low)}</div><div class="price">${money(working)}</div><div class="price">${money(high)}</div>
  <div><select id="ext_${key}_level" onchange="calcExterior()"><option value="working">Working</option><option value="low">Low</option><option value="high">High</option></select></div>
  <div class="sum" id="ext_${key}_sum">$0</div>
</div>`;
}

function extFixedRow(en,ru,unit,low,working,high,key){
return extBaseRow(en,ru,unit,low,working,high,key);
}

function calcExterior(){
  let base=0;

  [
    ["partial",2500,4000,6000],
    ["siding",3500,5000,7000]
  ].forEach(r=>{
    let qty=+document.getElementById(`ext_${r[0]}_qty`).value||0;
    let lvl=document.getElementById(`ext_${r[0]}_level`).value;
    let price=priceByLevel(lvl,r[1],r[2],r[3]);
    let line=qty*price;
    document.getElementById(`ext_${r[0]}_sum`).innerText=money(line);
    base+=line;
  });

  const pctRows=[
    ["twostory",.15,.20,.30],
    ["color",.15,.20,.30],
    ["brick",.20,.35,.50]
  ];

  let total=base;

  pctRows.forEach(r=>{
    let qty=+document.getElementById(`ext_${r[0]}_qty`).value||0;
    let lvl=document.getElementById(`ext_${r[0]}_level`).value;
    let pct=priceByLevel(lvl,r[1],r[2],r[3]);
    let line=qty>0 ? base*pct : 0;
    document.getElementById(`ext_${r[0]}_sum`).innerText=money(line);
    total+=line;
  });

  [
    ["foundation",300,600,1200],
    ["downspout",80,120,150]
  ].forEach(r=>{
    let qty=+document.getElementById(`ext_${r[0]}_qty`).value||0;
    let lvl=document.getElementById(`ext_${r[0]}_level`).value;
    let price=priceByLevel(lvl,r[1],r[2],r[3]);
    let line=qty*price;
    document.getElementById(`ext_${r[0]}_sum`).innerText=money(line);
    total+=line;
  });

  document.getElementById("exterior_total").innerText="Grand Total: "+money(total);
}

renderApp();
attachDrywallEvents();
</script>
</body>
</html>
