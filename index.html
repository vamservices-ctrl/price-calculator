<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <title>VAM Services Calculator</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #fff;
      --dark: #111827;
      --gold: #b8862b;
      --muted: #6b7280;
      --line: #e5e7eb;
      --green: #ecfdf5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      font-family: Arial, sans-serif;
      color: #111827;
      padding: 18px;
    }

    .container { max-width: 1300px; margin: auto; }

    .header {
      background: #111;
      color: white;
      padding: 22px;
      border-radius: 18px;
      margin-bottom: 18px;
      display: flex;
      gap: 18px;
      align-items: center;
    }

    .logo {
      width: 95px;
      height: 95px;
      object-fit: contain;
      background: white;
      border-radius: 12px;
      padding: 6px;
    }

    .header h1 { margin: 0; font-size: 30px; }
    .header p { margin: 6px 0; color: #d1d5db; }

    .card {
      background: white;
      border-radius: 16px;
      margin-bottom: 14px;
      box-shadow: 0 3px 14px rgba(0, 0, 0, .08);
      overflow: hidden;
    }

    .title {
      padding: 18px 20px;
      font-size: 21px;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      cursor: pointer;
    }

    .content { display: none; padding: 0 18px 18px; }

    /* ... остальные стили остались без изменений ... */

    @media (max-width: 900px) {
      /* ... медиа-запросы ... */
    }

    @media print {
      /* ... print стили ... */
    }
  </style>
</head>

    let currentEstimateItems = [];

    function money(n) {
      return "$" + Number(n).toLocaleString(undefined, { maximumFractionDigits: 0 });
    }

    function price(n) {
      return "$" + Number(n).toLocaleString(undefined, {
        minimumFractionDigits: n % 1 ? 2 : 0,
        maximumFractionDigits: 2
      });
    }

    function val(level, low, work, high) {
      return level === "low" ? low : level === "high" ? high : work;
    }

    function toggle(id) {
      let el = document.getElementById(id);
      el.style.display = el.style.display === "block" ? "none" : "block";
    }

    function drywallDiscount(qty) {
      if (qty >= 10) return .75;
      if (qty >= 6) return .80;
      if (qty >= 3) return .90;
      return 1;
    }

    function safeNumFromText(txt) {
      return Number(String(txt).replace(/[^\d.-]/g, "")) || 0;
    }

    function render() {
      const app = document.getElementById("app");
      app.innerHTML = "";
      sections.forEach(sec => {
        app.innerHTML += `<div class="card calculator-only">
          <div class="title" onclick="toggle('\( {sec.id}')"> \){sec.title}<span>+</span></div>
          <div id="\( {sec.id}" class="content"> \){renderSection(sec)}</div>
        </div>`;
      });
    }

    function renderSection(sec) {
      let html = `<button onclick="resetSection('${sec.id}')">Reset This Section</button>
                  <div class="row head">
                    <div>Add</div><div>Description</div><div>Qty</div><div>Unit</div>
                    <div>Low</div><div>Working</div><div>High</div><div>Select</div><div>Calculated</div>
                  </div>`;
      sec.items.forEach((r, i) => html += row(sec.id, i, r));
      html += <div class="total" id="${sec.id}_total">Grand Total: $0</div>;
      if (sec.id === "flooring") {
        html += <div class="note"><b>Assistant note:</b> Ask if client wants baseboards, quarter round, and how many transition strips are needed.</div>;
      }
      return html;
    }

    function row(id, i, r) {
      return `<div class="row">
        <div><input type="checkbox" id="\( {id}_ \){i}_add"></div>
        <div><div class="item-title">\( {r[0]}</div><div class="item-ru"> \){r[1]}</div></div>
        <div><input type="number" id="\( {id}_ \){i}_qty" value="0" min="0" step="0.01" oninput="calcSection('${id}')"></div>
        <div class="price">${r[2]}</div>
        <div class="price">${price(r[3])}</div>
        <div class="price">${price(r[4])}</div>
        <div class="price">${price(r[5])}</div>
        <div><select id="\( {id}_ \){i}_level" onchange="calcSection('${id}')">
          <option value="working">Working</option>
          <option value="low">Low</option>
          <option value="high">High</option>
        </select></div>
        <div class="sum" id="\( {id}_ \){i}_sum">$0</div>
      </div>`;
    }

    function calcSection(secId) {
      const sec = sections.find(s => s.id === secId);
      let total = 0, sectionBase = 0;

      sec.items.forEach((r, i) => {
        let qty = +document.getElementById(\( {secId}_ \){i}_qty).value || 0;
        let level = document.getElementById(\( {secId}_ \){i}_level).value;
        let rate = val(level, r[3], r[4], r[5]);
        let line = 0;

        if (r[6] === "sectionPercent") {
          line = qty > 0 ? sectionBase * (rate / 100) : 0;
        } else {
          if (r[6] === "discount") rate *= drywallDiscount(qty);
          line = qty * rate;
          sectionBase += line;
        }

        document.getElementById(\( {secId}_ \){i}_sum).innerText = money(line);
        total += line;
      });

      if (sec.minimum && total > 0 && total < sec.minimum) total = sec.minimum;
      if (secId === "cabinets" && total > 0 && total < 1500) total = 1500;

      document.getElementById(${secId}_total).innerText = "Grand Total: " + money(total);
    }

    function resetSection(id) {
      document.querySelectorAll(#${id} input[type="number"]).forEach(x => x.value = 0);
      document.querySelectorAll(#${id} input[type="checkbox"]).forEach(x => x.checked = false);
      document.querySelectorAll(#${id} select).forEach(x => x.value = "working");
      calcSection(id);
    }

    function resetAll() {
      sections.forEach(s => resetSection(s.id));
      ["clientName", "clientPhone", "clientEmail", "projectAddress", "projectNotes", "internalNotes"]
        .forEach(id => document.getElementById(id).value = "");
    }

    function collectItems() {
      let items = [];
      sections.forEach(sec => {
        sec.items.forEach((r, i) => {
          const add = document.getElementById(\( {sec.id}_ \){i}_add).checked;
          const qty = +document.getElementById(\( {sec.id}_ \){i}_qty).value || 0;
          const calculated = safeNumFromText(document.getElementById(\( {sec.id}_ \){i}_sum).innerText);

          if (add && qty > 0 && calculated > 0) {
            items.push({
              section: sec.title.replace(/^[^A-Za-z]+/, ""),
              name: r[0],
              ru: r[1],
              qty: qty,
              unit: r[2],
              calculated: calculated,
              final: calculated
            });
          }
        });
      });
      return items;
    }

    function createEstimate() {
      currentEstimateItems = collectItems();
      if (currentEstimateItems.length === 0) {
        alert("Select at least one item: Add + Qty.");
        return;
      }
      renderEditableItems();
      document.getElementById('estimateClientName').value =
document.getElementById('clientName').value;

document.getElementById('estimateClientPhone').value =
document.getElementById('clientPhone').value;

document.getElementById('estimateClientEmail').value =
document.getElementById('clientEmail').value;

document.getElementById('estimateProjectAddress').value =
document.getElementById('projectAddress').value;

document.getElementById('estimateProjectNotes').value =
document.getElementById('projectNotes').value;
      document.getElementById("calculatorScreen").classList.add("hidden");
      document.getElementById("estimateScreen").classList.remove("hidden");
      refreshEstimatePage();
      window.scrollTo(0, 0);
    }

    function backToCalculator() {
      document.getElementById("estimateScreen").classList.add("hidden");
      document.getElementById("calculatorScreen").classList.remove("hidden");
      window.scrollTo(0, 0);
    }

    function renderEditableItems() {
      let html = <div class="edit-grid head"><div>Description</div><div>Volume</div><div>Calculated</div><div>Editable Price</div></div>;
      currentEstimateItems.forEach((x, i) => {
        html += `<div class="edit-grid">
          <div><b>\( {x.name}</b><div class="small-muted"> \){x.ru}</div></div>
          <div>${x.qty} ${x.unit}</div>
          <div>${money(x.calculated)}</div>
          <div><input type="number" id="edit_\( {i}" value=" \){Math.round(x.final)}" oninput="refreshEstimatePage()"></div>
        </div>`;
      });
      document.getElementById("editableItems").innerHTML = html;
    }

    function getEstimateTotals() {
      currentEstimateItems.forEach((x, i) => {
        x.final = +document.getElementById(edit_${i}).value || 0;
      });

      const subtotal = currentEstimateItems.reduce((s, x) => s + x.final, 0);
      const type = document.getElementById("discountType").value;
      const valDiscount = +document.getElementById("discountValue").value || 0;
      let discount = 0;

      if (type === "fixed") discount = valDiscount;
      if (type === "percent") discount = subtotal * (valDiscount / 100);

      return { subtotal, discount, total: Math.max(0, subtotal - discount) };
    }

    function refreshEstimatePage() {
