<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VAM Services Calculator</title>
<style>
:root{
--bg:#f4f6f8;--card:#fff;--dark:#111827;--gold:#b8862b;--muted:#6b7280;--line:#e5e7eb;--green:#ecfdf5;
}
body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:#111827;padding:18px}
.container{max-width:1300px;margin:auto}
.header{background:#111;color:white;padding:22px;border-radius:18px;margin-bottom:18px;display:flex;gap:18px;align-items:center}
.logo{width:95px;height:95px;object-fit:contain}
.header h1{margin:0;font-size:30px}
.header p{margin:6px 0;color:#d1d5db}
.card{background:white;border-radius:16px;margin-bottom:14px;box-shadow:0 3px 14px rgba(0,0,0,.08);overflow:hidden}
.title{padding:18px 20px;font-size:21px;font-weight:700;display:flex;justify-content:space-between;cursor:pointer}
.content{display:none;padding:0 18px 18px}
.client-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.row{display:grid;grid-template-columns:.5fr 2.2fr .7fr .65fr .8fr .8fr .8fr .9fr 1fr 1fr;gap:7px;align-items:center;border-top:1px solid var(--line);padding:10px 0}
.head{font-size:12px;font-weight:700;color:#4b5563;text-transform:uppercase}
.item-title{font-weight:700}
.item-ru{font-size:12px;color:var(--muted);margin-top:3px}
input,select,textarea{width:100%;box-sizing:border-box;border:1px solid #d1d5db;border-radius:8px;padding:9px;font-size:14px;background:white}
textarea{min-height:70px}
.price{font-size:13px;color:#374151}
.sum{font-weight:700}
.total{background:var(--green);border:1px solid #bbf7d0;border-radius:12px;padding:14px;margin-top:14px;font-size:22px;font-weight:800}
.note{font-size:12px;color:var(--muted);margin-top:8px}
button{background:#111;color:white;border:0;border-radius:10px;padding:10px 14px;margin:8px 6px 8px 0;cursor:pointer;font-weight:700}
button.gold{background:var(--gold)}
button.gray{background:#6b7280}
.estimate-box{background:white;border:1px solid #d1d5db;border-radius:16px;padding:22px;margin-top:16px}
.estimate-header{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid var(--gold);padding-bottom:16px}
.estimate-logo{width:90px}
.estimate-title{font-size:28px;font-weight:800}
.estimate-table{width:100%;border-collapse:collapse;margin-top:18px}
.estimate-table th{background:#111;color:white;text-align:left;padding:10px}
.estimate-table td{border-bottom:1px solid #ddd;padding:12px;vertical-align:top}
.money{text-align:right;font-weight:700}
.summary{margin-top:18px;max-width:420px;margin-left:auto;border:1px solid #ddd;border-radius:12px;padding:14px}
.summary-row{display:flex;justify-content:space-between;margin:8px 0}
.big-total{font-size:24px;color:var(--gold);font-weight:900}
@media(max-width:900px){
.row{grid-template-columns:1fr 1fr}
.head{display:none}
.client-grid{grid-template-columns:1fr}
.header{display:block;text-align:center}
}
@media print{
body{background:white}
.card,.controls,.calculator-only{display:none!important}
.estimate-box{border:0;box-shadow:none}
}
</style>
</head>

function money(n){return "$"+Number(n).toLocaleString(undefined,{maximumFractionDigits:0});}
function price(n){return "$"+Number(n).toLocaleString(undefined,{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2});}
function val(level,low,work,high){return level==="low"?low:level==="high"?high:work;}
function toggle(id){let el=document.getElementById(id);el.style.display=el.style.display==="block"?"none":"block";}
function drywallDiscount(qty){if(qty>=10)return .75;if(qty>=6)return .80;if(qty>=3)return .90;return 1;}

function render(){
const app=document.getElementById("app");app.innerHTML="";
sections.forEach(sec=>{
app.innerHTML+=`
<div class="card calculator-only">
<div class="title" onclick="toggle('${sec.id}')">${sec.title}<span>+</span></div>
<div id="${sec.id}" class="content">${renderSection(sec)}</div>
</div>`;
});
generateEstimate();
}

function renderSection(sec){
let html=`<button onclick="resetSection('${sec.id}')">Reset This Section</button>
<div class="row head">
<div>Add</div><div>Description</div><div>Qty</div><div>Unit</div><div>Low</div><div>Working</div><div>High</div><div>Select</div><div>Calculated</div><div>Override</div>
</div>`;
sec.items.forEach((r,i)=>{
html+=`
<div class="row">
<div><input type="checkbox" id="${sec.id}_${i}_add" onchange="generateEstimate()"></div>
<div><div class="item-title">${r[0]}</div><div class="item-ru">${r[1]}</div></div>
<div><input type="number" id="${sec.id}_${i}_qty" value="0" min="0" step="0.01" oninput="calcSection('${sec.id}')"></div>
<div class="price">${r[2]}</div>
<div class="price">${price(r[3])}</div>
<div class="price">${price(r[4])}</div>
<div class="price">${price(r[5])}</div>
<div><select id="${sec.id}_${i}_level" onchange="calcSection('${sec.id}')">
<option value="working">Working</option><option value="low">Low</option><option value="high">High</option>
</select></div>
<div class="sum" id="${sec.id}_${i}_sum">$0</div>
<div><input type="number" id="${sec.id}_${i}_override" placeholder="$" oninput="generateEstimate()"></div>
</div>`;
});
html+=`<div class="total" id="${sec.id}_total">Grand Total: $0</div>`;
if(sec.id==="flooring")html+=`<div class="note"><b>Assistant note:</b> Ask if client wants baseboards, quarter round, and how many transition strips are needed.</div>`;
return html;
}

function calcSection(secId){
const sec=sections.find(s=>s.id===secId);
let total=0, base=0, cabBase=0;

sec.items.forEach((r,i)=>{
let qty=+document.getElementById(`${secId}_${i}_qty`).value||0;
let level=document.getElementById(`${secId}_${i}_level`).value;
let rate=val(level,r[3],r[4],r[5]);
let line=0;

if(secId==="cabinets" && (i===0 || i===1)){
line=qty*rate; cabBase+=line;
} else if(secId==="cabinets" && r[6]==="cabPercent"){
line=qty>0 ? cabBase*(rate/100) : 0;
} else if(secId==="exterior" && (i===0 || i===1)){
line=qty*rate; base+=line;
} else if(secId==="exterior" && r[6]==="percent"){
line=qty>0 ? base*(rate/100) : 0;
} else {
if(r[6]==="discount") rate*=drywallDiscount(qty);
line=qty*rate;
}

document.getElementById(`${secId}_${i}_sum`).innerText=money(line);
total+=line;
});

if(sec.minimum && total>0 && total<sec.minimum) total=sec.minimum;
if(secId==="cabinets" && total>0 && total<1500) total=1500;
document.getElementById(`${secId}_total`).innerText="Grand Total: "+money(total);
generateEstimate();
}

function resetSection(id){
document.querySelectorAll(`#${id} input[type="number"]`).forEach(x=>x.value=0);
document.querySelectorAll(`#${id} input[type="checkbox"]`).forEach(x=>x.checked=false);
document.querySelectorAll(`#${id} select`).forEach(x=>x.value="working");
calcSection(id);
}

function resetAll(){
sections.forEach(s=>resetSection(s.id));
["clientName","clientPhone","clientEmail","projectAddress","projectNotes","internalNotes"].forEach(id=>document.getElementById(id).value="");
document.getElementById("discountType").value="none";
document.getElementById("discountValue").value=0;
generateEstimate();
}

function collectEstimateItems(){
let items=[];
sections.forEach(sec=>{
sec.items.forEach((r,i)=>{
let add=document.getElementById(`${sec.id}_${i}_add`).checked;
let qty=+document.getElementById(`${sec.id}_${i}_qty`).value||0;
let calcText=document.getElementById(`${sec.id}_${i}_sum`).innerText.replace(/[$,]/g,"");
let calculated=+calcText||0;
let override=+document.getElementById(`${sec.id}_${i}_override`).value||0;
let final=override>0?override:calculated;
if(add && qty>0 && final>0){
items.push({name:r[0],ru:r[1],qty:qty,unit:r[2],total:final});
}
});
});
return items;
}

function generateEstimate(){
let items=collectEstimateItems();
let subtotal=items.reduce((s,x)=>s+x.total,0);
let discountType=document.getElementById("discountType").value;
let discountValue=+document.getElementById("discountValue").value||0;
let discount=0;
if(discountType==="fixed") discount=discountValue;
if(discountType==="percent") discount=subtotal*(discountValue/100);
let total=Math.max(0,subtotal-discount);

let rows=items.map((x,i)=>`
<tr>
<td>${i+1}</td>
<td><b>${x.name}</b><br><span style="color:#666">${x.ru}</span></td>
<td class="money">${money(x.total)}</td>
</tr>`).join("");

if(!rows) rows=`<tr><td colspan="3">No items selected yet.</td></tr>`;

document.getElementById("estimatePreview").innerHTML=`
<div class="estimate-header">
<div>
<img src="LOGO.jpg" class="estimate-logo">
<h2>VAM Services LLC</h2>
<div>Home Repair & Remodeling</div>
<div>Phone: (858) 910-2956</div>
<div>Email: vamservicesllc.com@gmail.com</div>
<div>Website: vamservicesllc.com</div>
</div>
<div>
<div class="estimate-title">PRELIMINARY ESTIMATE</div>
<div>Date: ${new Date().toLocaleDateString()}</div>
<div>Estimate #: VAM-${Date.now().toString().slice(-6)}</div>
</div>
</div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:18px">
<div>
<h3>Client Information</h3>
<div><b>Name:</b> ${document.getElementById("clientName").value||""}</div>
<div><b>Phone:</b> ${document.getElementById("clientPhone").value||""}</div>
<div><b>Email:</b> ${document.getElementById("clientEmail").value||""}</div>
</div>
<div>
<h3>Project Information</h3>
<div><b>Address:</b> ${document.getElementById("projectAddress").value||""}</div>
<div><b>Notes:</b> ${document.getElementById("projectNotes").value||""}</div>
</div>
</div>

<table class="estimate-table">
<thead><tr><th>#</th><th>Description of Work</th><th>Estimated Cost</th></tr></thead>
<tbody>${rows}</tbody>
</table>

<div class="summary">
<div class="summary-row"><span>Subtotal</span><b>${money(subtotal)}</b></div>
${discount>0?`<div class="summary-row"><span>Discount</span><b style="color:green">-${money(discount)}</b></div>`:""}
<hr>
<div class="summary-row big-total"><span>Estimated Total</span><span>${money(total)}</span></div>
</div>

<div style="margin-top:20px">
<h3>Notes</h3>
<ul>
<li>This is a preliminary estimate.</li>
<li>Final price may change after site inspection, measurements, and material selection.</li>
<li>Materials are included unless otherwise specified.</li>
<li>This estimate is valid for 30 days.</li>
</ul>
</div>
`;

return {items,subtotal,discount,total};
}

Final price may change after site inspection, measurements, and material selection.
Materials are included unless otherwise specified.
`;
return text;
}

function copyEstimate(){
navigator.clipboard.writeText(getClientText());
alert("Estimate copied.");
}

function sendEstimate(){
let e=generateEstimate();
let payload={
clientName:document.getElementById("clientName").value,
clientPhone:document.getElementById("clientPhone").value,
clientEmail:document.getElementById("clientEmail").value,
projectAddress:document.getElementById("projectAddress").value,
scopeText:e.items.map((x,i)=>`${i+1}. ${x.name} - ${money(x.total)}`).join("\\n"),
subtotal:Math.round(e.subtotal),
discount:Math.round(e.discount),
total:Math.round(e.total)
};

fetch(WEB_APP_URL,{
method:"POST",
mode:"no-cors",
headers:{"Content-Type":"text/plain"},
body:JSON.stringify(payload)
});

alert("Estimate sent to email and Telegram.");
}

render();
</script>
