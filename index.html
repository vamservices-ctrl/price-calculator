<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VAM Services Calculator</title>
<style>
body{font-family:Arial,sans-serif;background:#f3f4f6;margin:0;padding:18px;color:#111}
.container{max-width:1100px;margin:auto}
.header{background:#111;color:#fff;padding:22px;border-radius:18px;margin-bottom:18px}
.header h1{margin:0;font-size:28px}
.header p{margin:8px 0 0;color:#bbb}
.card{background:#fff;border-radius:16px;margin-bottom:14px;box-shadow:0 3px 12px rgba(0,0,0,.08);overflow:hidden}
.title{padding:18px;font-size:21px;font-weight:700;cursor:pointer;display:flex;justify-content:space-between}
.content{display:none;padding:0 18px 18px}
.row{display:grid;grid-template-columns:2fr .8fr 1fr 1fr 1fr 1fr 1fr;gap:8px;align-items:center;border-top:1px solid #eee;padding:10px 0}
.head{font-size:13px;font-weight:bold;color:#555}
input,select{padding:9px;border:1px solid #ccc;border-radius:8px;width:100%;box-sizing:border-box}
.price{font-size:13px;color:#333}
.sum{font-weight:bold}
.total{background:#ecfdf5;border:1px solid #bbf7d0;border-radius:12px;padding:14px;margin-top:14px;font-size:20px;font-weight:bold}
.note{font-size:13px;color:#666;margin-top:8px}
@media(max-width:800px){
.row{grid-template-columns:1fr 1fr}
.head{display:none}
}
</style>
</head>
<body>
<div class="container">

<div class="header">
<h1>VAM Services Price Calculator</h1>
<p>Внутренний калькулятор предварительной стоимости работ</p>
</div>

<div class="card">
<div class="title" onclick="toggle('painting')">🎨 Покраска <span>+</span></div>
<div id="painting" class="content"></div>
</div>

<div class="card">
<div class="title" onclick="toggle('cabinets')">🍽 Покраска кухонных шкафов <span>+</span></div>
<div id="cabinets" class="content"></div>
</div>

<div class="card">
<div class="title" onclick="toggle('drywall')">🧱 Гипсокартон <span>+</span></div>
<div id="drywall" class="content"></div>
</div>

<div class="card">
<div class="title" onclick="toggle('flooring')">🪵 Полы <span>+</span></div>
<div id="flooring" class="content"></div>
</div>

<div class="card">
<div class="title" onclick="toggle('doors')">🚪 Двери / плинтусы / молдинги <span>+</span></div>
<div id="doors" class="content"></div>
</div>

<div class="card">
<div class="title" onclick="toggle('fence')">🏡 Заборы <span>+</span></div>
<div id="fence" class="content"></div>
</div>

<div class="card">
<div class="title" onclick="toggle('deck')">🏡 Deck / Pergola <span>+</span></div>
<div id="deck" class="content"></div>
</div>

</div>

<script>
const sections = {
painting: [
["Покраска стен дома", "SF дома", 1.75, 2.375, 3.00],
["Мебель частично", "%", .15, .15, .15],
["Мебель полностью", "%", .20, .20, .20],
["Покраска потолков", "SF дома", .75, .875, 1.00],
["3-й слой / праймер", "SF", .75, 1.00, 1.50],
["Покраска двери", "шт", 120, 135, 150],
["Покраска подоконника", "шт", 25, 30, 50],
["Подоконник с ремонтом", "шт", 50, 85, 125],
["Покраска полки", "шт", 25, 30, 50],
["Полка с ремонтом", "шт", 50, 85, 125],
["Покраска дверной коробки", "шт", 40, 60, 100]
],
cabinets: [
["Дверца шкафа", "шт", 60, 90, 135],
["Ящик", "шт", 50, 70, 110],
["Фрейм шкафов", "% от дверей/ящиков", .25, .30, .40]
],
drywall: [
["Небольшой ремонт отверстия", "шт", 150, 200, 300],
["Средний ремонт до 2×2 ft", "шт", 250, 400, 600],
["Ремонт после протечки", "шт", 400, 600, 800],
["Замена ленты 10 LF", "участок", 400, 600, 800],
["Skim coat 1 слой", "SF", 2, 3, 4],
["Skim coat 2 слоя / Level 5", "SF", 4, 6, 8]
],
flooring: [
["LVP укладка", "SF", 2, 2.75, 3.5],
["Ламинат укладка", "SF", 2.5, 3.25, 4],
["Инженерная доска плавающая", "SF", 3, 3.75, 4.5],
["Инженерная доска на клей", "SF", 6, 7, 9],
["Лестница LVP / ламинат", "ступень", 75, 125, 200],
["Лестница инженерная доска", "ступень", 100, 175, 300],
["Демонтаж ковра", "SF", .25, .45, .75],
["Демонтаж LVP / ламината", "SF", .75, 1, 1.25],
["Демонтаж приклеенной доски", "SF", 3, 4.25, 6],
["Выравнивание пола маленький участок", "шт", 200, 350, 500],
["Выравнивание пола средний участок", "шт", 500, 1000, 1500]
],
doors: [
["Межкомнатная дверь", "шт", 150, 200, 275],
["Prehung дверь", "шт", 150, 200, 275],
["Входная дверь", "шт", 400, 700, 1000],
["Плинтус установка", "LF", 1.5, 2.25, 3],
["Плинтус установка + покраска", "LF", 4, 5, 6],
["Crown molding", "LF", 2, 2.75, 3.5],
["Настенные полки", "шт/проект", 75, 200, 500],
["TV Mount", "шт", 100, 200, 400],
["Потолочный вентилятор", "шт", 125, 225, 450],
["Люстра стандартная", "шт", 150, 325, 800],
["Люстра 18–20 ft", "шт", 300, 650, 2000]
],
fence: [
["Деревянный забор 6 ft", "LF", 35, 50, 70],
["Железные столбы доплата", "LF", 5, 10, 12],
["Верхняя корона", "LF", 8, 12, 18],
["Демонтаж старого забора", "LF", 3, 5, 8],
["Ворота", "шт", 250, 600, 1500]
],
deck: [
["Новый деревянный deck", "SF", 35, 55, 85],
["Composite deck", "SF", 50, 85, 150],
["Мойка deck", "SF", .25, .45, .75],
["Морилка deck", "SF", 1.5, 2.5, 4],
["Замена досок deck", "LF", 15, 25, 45],
["Pergola маленькая", "проект", 2000, 3000, 4000],
["Pergola средняя", "проект", 4000, 6000, 8000],
["Pergola большая", "проект", 8000, 14000, 20000]
]
};

function money(n){
return "$" + Math.round(n).toLocaleString();
}

function toggle(id){
const el=document.getElementById(id);
el.style.display=el.style.display==="block"?"none":"block";
}

function render(){
for(const sec in sections){
let html=`<div class="row head">
<div>Работа</div><div>Кол-во</div><div>Выбор</div><div>Низкая</div><div>Средняя</div><div>Высокая</div><div>Сумма</div>
</div>`;
sections[sec].forEach((r,i)=>{
html+=`
<div class="row">
<div><b>${r[0]}</b><div class="note">${r[1]}</div></div>
<div><input type="number" value="0" min="0" step="0.01" id="${sec}_${i}_qty" oninput="calc('${sec}')"></div>
<div>
<select id="${sec}_${i}_level" onchange="calc('${sec}')">
<option value="med">Средняя</option>
<option value="low">Низкая</option>
<option value="high">Высокая</option>
</select>
</div>
<div class="price">${money(r[2])}</div>
<div class="price">${money(r[3])}</div>
<div class="price">${money(r[4])}</div>
<div class="sum" id="${sec}_${i}_sum">$0</div>
</div>`;
});
html+=`<div class="total" id="${sec}_total">Итого: $0</div>
<div class="note">Это предварительная цена. Финальная смета зависит от фото, состояния объекта, материалов и сложности.</div>`;
document.getElementById(sec).innerHTML=html;
}
}

function calc(sec){
let total=0;
sections[sec].forEach((r,i)=>{
let qty=parseFloat(document.getElementById(`${sec}_${i}_qty`).value)||0;
let lvl=document.getElementById(`${sec}_${i}_level`).value;
let price=lvl==="low"?r[2]:lvl==="high"?r[4]:r[3];

let line=qty*price;

document.getElementById(`${sec}_${i}_sum`).innerText=money(line);
total+=line;
});

if(sec==="drywall" && total>0 && total<200) total=200;
if(sec==="flooring" && total>0 && total<350) total=350;
if(sec==="deck" && total>0 && total<250) total=250;

document.getElementById(`${sec}_total`).innerText="Итого: "+money(total);
}

render();
</script>
</body>
</html>
