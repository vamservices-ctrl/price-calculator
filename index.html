<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VAM Services Calculator</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #fff;
      --dark: #111827;
      --gold: #b8862b;
      --muted: #6b7280;
      --line: #e5e7eb;
      --green: #ecfdf5;
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      font-family: Arial, sans-serif;
      color: #111827;
      padding: 18px
    }

    .container {
      max-width: 1300px;
      margin: auto
    }

    .header {
      background: #111;
      color: white;
      padding: 22px;
      border-radius: 18px;
      margin-bottom: 18px;
      display: flex;
      gap: 18px;
      align-items: center
    }

    .logo {
      width: 95px;
      height: 95px;
      object-fit: contain;
      background: white;
      border-radius: 12px;
      padding: 6px
    }

    .header h1 {
      margin: 0;
      font-size: 30px
    }

    .header p {
      margin: 6px 0;
      color: #d1d5db
    }

    .card {
      background: white;
      border-radius: 16px;
      margin-bottom: 14px;
      box-shadow: 0 3px 14px rgba(0, 0, 0, .08);
      overflow: hidden
    }

    .title {
      padding: 18px 20px;
      font-size: 21px;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      cursor: pointer
    }

    .content {
      display: none;
      padding: 0 18px 18px
    }

    .client-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px
    }

    .row {
      display: grid;
      grid-template-columns: 2.2fr .7fr .65fr .8fr .8fr .8fr .9fr 1fr;
      gap: 7px;
      align-items: center;
      border-top: 1px solid var(--line);
      padding: 10px 0
    }

    .head {
      font-size: 12px;
      font-weight: 700;
      color: #4b5563;
      text-transform: uppercase
    }

    .item-title {
      font-weight: 700
    }

    .item-ru {
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 9px;
      font-size: 14px;
      background: white
    }

    textarea {
      min-height: 70px
    }

    .price {
      font-size: 13px;
      color: #374151
    }

    .sum {
      font-weight: 700
    }

    .total {
      background: var(--green);
      border: 1px solid #bbf7d0;
      border-radius: 12px;
      padding: 14px;
      margin-top: 14px;
      font-size: 22px;
      font-weight: 800
    }

    .note {
      font-size: 12px;
      color: var(--muted);
      margin-top: 8px
    }

    button {
      background: #111;
      color: white;
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      margin: 8px 6px 8px 0;
      cursor: pointer;
      font-weight: 700
    }

    button.gold {
      background: var(--gold)
    }

    button.gray {
      background: #6b7280
    }

    button.green {
      background: #047857
    }

    .hidden {
      display: none !important
    }

    .estimate-box {
      background: white;
      border: 1px solid #d1d5db;
      border-radius: 16px;
      padding: 22px;
      margin-top: 16px
    }

    .estimate-header {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      border-bottom: 2px solid var(--gold);
      padding-bottom: 16px
    }

    .estimate-logo {
      width: 90px;
      background: white;
      border-radius: 12px;
      padding: 4px
    }

    .estimate-title {
      font-size: 28px;
      font-weight: 800
    }

    .estimate-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 18px
    }

    .estimate-table th {
      background: #111;
      color: white;
      text-align: left;
      padding: 10px
    }

    .estimate-table td {
      border-bottom: 1px solid #ddd;
      padding: 12px;
      vertical-align: top
    }

    .money {
      text-align: right;
      font-weight: 700
    }

    .summary {
      margin-top: 18px;
      max-width: 420px;
      margin-left: auto;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 14px
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin: 8px 0
    }

    .big-total {
      font-size: 24px;
      color: var(--gold);
      font-weight: 900
    }

    .edit-grid {
      display: grid;
      grid-template-columns: 2fr .65fr .65fr .85fr .85fr .55fr;
      gap: 10px;
      align-items: center;
      border-top: 1px solid var(--line);
      padding: 10px 0
    }
    
    input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

input[type="number"] {
  -moz-appearance: textfield;
}

    .small-muted {
      font-size: 12px;
      color: var(--muted)
    }

    .estimate-editor-section {
      border-top: 1px solid var(--line);
      padding-top: 14px;
      margin-top: 14px;
    }

    .estimate-editor-section h3 {
      margin: 0 0 12px;
      font-size: 18px;
    }

    .delete-btn {
      background: #991b1b;
      padding: 9px 10px;
      margin: 0;
    }

    .line-total {
      font-weight: 800;
      text-align: right;
      padding-top: 9px;
    }

    @media (max-width: 900px) {
      body {
        padding: 8px;
        font-size: 16px;
      }

      .container {
        max-width: 100%;
      }

      .header {
        display: block;
        text-align: center;
        padding: 22px 14px;
        border-radius: 22px;
      }

      .logo {
        width: 95px;
        height: auto;
        margin: 0 auto 12px;
      }

      .header h1 {
        font-size: 28px;
        line-height: 1.15;
      }

      .header p {
        font-size: 16px;
      }

      .client-grid {
        grid-template-columns: 1fr;
      }

      .title {
        font-size: 21px;
        padding: 18px 16px;
      }

      .content {
        padding: 0 14px 16px;
      }

      .row {
        display: block;
        border-top: 1px solid var(--line);
        padding: 16px 0;
      }

      .row.head {
        display: none;
      }

      .row>div {
        margin-bottom: 8px;
      }

      .row>div:first-child {
        float: none;
        width: auto;
      }

      .item-title {
        font-size: 17px;
        padding-right: 0;
      }

      .item-ru {
        font-size: 13px;
      }

      input,
      select,
      textarea {
        font-size: 16px;
        padding: 11px;
      }

      .price {
        display: inline-block;
        margin-right: 12px;
        font-size: 14px;
      }

      .sum {
        font-size: 18px;
        margin-top: 6px;
      }

      .total {
        font-size: 20px;
      }

      button {
        width: 100%;
        margin: 6px 0;
        padding: 13px;
        font-size: 16px;
      }

      .estimate-header {
        display: block;
        text-align: center;
      }

      .estimate-logo {
        width: 85px;
        height: auto;
        margin-bottom: 10px;
      }

      .estimate-title {
        font-size: 24px;
        line-height: 1.15;
        margin-top: 12px;
      }

      .edit-grid {
        display: block;
        padding: 14px 0;
      }

      .edit-grid.head {
        display: none;
      }

      .edit-grid>div {
        margin-bottom: 8px;
      }

      .line-total {
        text-align: left;
      }

      .estimate-box {
        padding: 14px;
        border-radius: 14px;
      }

      .estimate-table {
        font-size: 14px;
      }

      .estimate-table th,
      .estimate-table td {
        padding: 8px;
      }

      .estimate-table th:nth-child(1),
      .estimate-table td:nth-child(1) {
        display: none;
      }

      .summary {
        max-width: 100%;
        margin-left: 0;
      }

      .big-total {
        font-size: 22px;
      }
    }

    @media print {
      @page {
        size: Letter;
        margin: 0.45in;
      }

      body {
        background: white !important;
        padding: 0 !important;
        color: #111827 !important;
      }

      .calculator-screen,
      .estimate-controls,
      .top-buttons,
      .card:not(.print-keep) {
        display: none !important;
      }

      .container {
        max-width: 100% !important;
        margin: 0 !important;
      }

      #estimateScreen {
        display: block !important;
      }

      .estimate-box {
        border: none !important;
        box-shadow: none !important;
        border-radius: 0 !important;
        padding: 0 !important;
        margin: 0 !important;
        background: white !important;
      }

      .estimate-header {
        display: flex !important;
        justify-content: space-between !important;
        align-items: flex-start !important;
        border-bottom: 2px solid #b8862b !important;
        padding-bottom: 14px !important;
        margin-bottom: 18px !important;
      }

      .estimate-logo {
        width: 80px !important;
        height: auto !important;
        border-radius: 8px !important;
      }

      .estimate-title {
        font-size: 24px !important;
        font-weight: 900 !important;
        text-align: right !important;
      }

      .estimate-table {
        width: 100% !important;
        border-collapse: collapse !important;
        margin-top: 16px !important;
        font-size: 12px !important;
      }

      .estimate-table th {
        background: #111827 !important;
        color: white !important;
        padding: 8px !important;
      }

      .estimate-table td {
        padding: 8px !important;
        border-bottom: 1px solid #ddd !important;
      }

      .summary {
        page-break-inside: avoid !important;
        max-width: 360px !important;
        margin-left: auto !important;
        border: 1px solid #ddd !important;
        border-radius: 8px !important;
        padding: 12px !important;
      }

      .big-total {
        font-size: 20px !important;
        color: #b8862b !important;
      }

      h2,
      h3 {
        page-break-after: avoid !important;
      }

      table,
      tr,
      td,
      th {
        page-break-inside: avoid !important;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div id="calculatorScreen" class="calculator-screen">
      <div class="header"><img src="LOGO.jpg" class="logo" alt="VAM Services Logo">
        <div>
          <h1>VAM Services Price Calculator</h1>
          <p>Home Repair & Remodeling</p>
          <p>Internal calculator + preliminary estimate generator</p>
        </div>
      </div>
      <div id="app"></div>
      <div class="card top-buttons">
        <div class="content" style="display:block"><button class="gold" onclick="createEstimate()">Create
            Estimate</button><button class="gray" onclick="resetAll()">Reset All</button></div>
      </div>
    </div>
    <div id="estimateScreen" class="hidden">
     <div class="top-buttons estimate-controls">
  <button class="gray" onclick="backToCalculator()">Back to Calculator</button>
  <button class="green" onclick="sendEstimate()">Send Email + Telegram</button>
  <button class="gray" onclick="printEstimate()">Print</button>
</div>
      <div class="card estimate-controls">
        <div class="title" onclick="toggle('estimateEdit')">✏️ Estimate Editing / Discount <span>+</span></div>
        <div id="estimateEdit" class="content" style="display:block">
          <div class="estimate-editor-section">
            <h3>Client Information</h3>
            <div class="client-grid">
              <div>
                <label>Client Name</label>
                <input id="clientName" placeholder="Client name" oninput="refreshEstimatePage()">
              </div>
              <div>
                <label>Phone</label>
                <input id="clientPhone" placeholder="Phone" oninput="refreshEstimatePage()">
              </div>
              <div>
                <label>Email</label>
                <input id="clientEmail" placeholder="Client email" oninput="refreshEstimatePage()">
              </div>
              <div>
                <label>Project Address</label>
                <input id="projectAddress" placeholder="Project address" oninput="refreshEstimatePage()">
              </div>
            </div>

            <label>Project Notes</label>
            <textarea id="projectNotes" placeholder="Project notes" oninput="refreshEstimatePage()"></textarea>
          </div>

          <div class="estimate-editor-section">
            <h3>Estimate Items</h3>
            <button class="gold" onclick="addCustomLine()">+ Add Custom Line</button>
            <div id="editableItems"></div>
          </div>

          <div class="estimate-editor-section">
            <h3>Discount</h3>
            <div class="client-grid">
              <div>
                <label>Discount Type</label>
                <select id="discountType" onchange="refreshEstimatePage()">
                  <option value="none">None</option>
                  <option value="fixed">Fixed Amount</option>
                  <option value="percent">Percentage</option>
                </select>
              </div>

              <div>
                <label>Discount Value</label>
                <input
  type="number"
  id="discountValue"
  value="0"
  oninput="refreshEstimatePage()"
>
              </div>
            </div>
          </div>

          <label>Internal Notes - Not Shown To Client</label>
          <textarea id="internalNotes" placeholder="Internal notes"></textarea>
          <div class="note">Editable prices and internal notes are for you only. Client version shows service, volume, and final cost.</div>
        </div>
      </div>
      <div id="estimatePreview" class="estimate-box"></div>
    </div>
  </div>

    function val(level, low, work, high) { return level === "low" ? low : level === "high" ? high : work; }
    function toggle(id) { let el = document.getElementById(id); el.style.display = el.style.display === "block" ? "none" : "block"; }
    function drywallDiscount(qty) { if (qty >= 10) return .75; if (qty >= 6) return .80; if (qty >= 3) return .90; return 1; }
    function safeNumFromText(txt) { return Number(String(txt).replace(/[^\d.-]/g, "")) || 0; }
    function parsePriceInput(value) {
  return Number(String(value).replace(",", ".")) || 0;
}
    function render() { const app = document.getElementById("app"); app.innerHTML = ""; sections.forEach(sec => { app.innerHTML += `<div class="card calculator-only"><div class="title" onclick="toggle('${sec.id}')">${sec.title}<span>+</span></div><div id="${sec.id}" class="content">${renderSection(sec)}</div></div>`; }); }
    function renderSection(sec) {
      let html = `
        <button onclick="resetSection('${sec.id}')">Reset This Section</button>

          <div>Description</div>

      `;

      sec.items.forEach((r, i) => {
        html += row(sec.id, i, r);
      });

      html += `<div class="total" id="${sec.id}_total">Grand Total: $0</div>`;

      if (sec.id === "flooring") {
        html += `

    function row(id, i, r) {
      return `
        <div class="row">
          <div>
            <div class="item-title">${r[0]}</div>
            <div class="item-ru">${r[1]}</div>
          </div>

          <div>
           <input
    type="text"
    id="${id}_${i}_qty"
    value=""
    oninput="this.value=this.value.replace(/[^0-9]/g,''); calcSection('${id}')"
>
          </div>

          <div class="price">${r[2]}</div>
          <div class="price">${price(r[3])}</div>
          <div class="price">${price(r[4])}</div>
          <div class="price">${price(r[5])}</div>

          <div>
            <select id="${id}_${i}_level" onchange="calcSection('${id}')">
              <option value="working">Working</option>
              <option value="low">Low</option>
              <option value="high">High</option>
            </select>
          </div>

          <div class="sum" id="${id}_${i}_sum">$0</div>
        </div>
      `;
    }

    function calcSection(secId) {
      const sec = sections.find(s => s.id === secId);
      let total = 0;
      let sectionBase = 0;

      sec.items.forEach((r, i) => {
        let qty = +document.getElementById(`${secId}_${i}_qty`).value || 0;
        let level = document.getElementById(`${secId}_${i}_level`).value;
        let rate = val(level, r[3], r[4], r[5]);
        let line = 0;

        if (r[6] === "sectionPercent") {
          line = qty > 0 ? sectionBase * (rate / 100) : 0;
        } else {
          if (r[6] === "discount") {
            rate *= drywallDiscount(qty);
          }

          line = qty * rate;
          sectionBase += line;
        }

        document.getElementById(`${secId}_${i}_sum`).innerText = money(line);
        total += line;
      });

      if (sec.minimum && total > 0 && total < sec.minimum) {
        total = sec.minimum;
      }

      if (secId === "cabinets" && total > 0 && total < 1500) {
        total = 1500;
      }

      document.getElementById(`${secId}_total`).innerText = "Grand Total: " + money(total);
    }

    function resetSection(id) {
      document.querySelectorAll(`#${id} input`).forEach(x => x.value = "");
      document.querySelectorAll(`#${id} select`).forEach(x => x.value = "working");
      calcSection(id);
    }

    function resetAll() {
      sections.forEach(s => resetSection(s.id));

      ["clientName", "clientPhone", "clientEmail", "projectAddress", "projectNotes", "internalNotes"].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = "";
      });

      const discountType = document.getElementById("discountType");
      const discountValue = document.getElementById("discountValue");

      if (discountType) discountType.value = "none";
      if (discountValue) discountValue.value = 0;
    }

    function collectItems() {
      let items = [];

      sections.forEach(sec => {
        sec.items.forEach((r, i) => {
          const qty = +document.getElementById(`${sec.id}_${i}_qty`).value || 0;
          const calculated = safeNumFromText(document.getElementById(`${sec.id}_${i}_sum`).innerText);

          if (qty > 0 && calculated > 0) {
            const unitPrice = calculated / qty;

            items.push({
              section: sec.title.replace(/^[^A-Za-z]+/, ""),
              name: r[0],
              ru: r[1],
              qty: qty,
              unit: r[2],
              unitPrice: unitPrice,
              calculated: calculated,
              final: calculated
            });
          }
        });
      });

      return items;
    }

    function getEstimateTotals() {
      currentEstimateItems.forEach((x, i) => {
        x.qty = parseInt(x.qty, 10) || 0;
        x.unitPrice = parsePriceInput(x.unitPrice);
        x.final = x.qty * x.unitPrice;

        const totalCell = document.getElementById(`line_total_${i}`);

        if (totalCell) {
          totalCell.innerText = money(x.final);
        }
      });

      const subtotal = currentEstimateItems.reduce((s, x) => s + x.final, 0);
      const type = document.getElementById("discountType").value;
      const valDiscount = +document.getElementById("discountValue").value || 0;

      let discount = 0;

      if (type === "fixed") {
        discount = valDiscount;
      }

      if (type === "percent") {
        discount = subtotal * (valDiscount / 100);
      }

      return {
        subtotal,
        discount,
        total: Math.max(0, subtotal - discount)
      };
    }

function sendEstimate() {
  refreshEstimatePage();

  const t = getEstimateTotals();

  const payload = {
    clientName: getValue("clientName"),
    clientPhone: getValue("clientPhone"),
    clientEmail: getValue("clientEmail"),
    projectAddress: getValue("projectAddress"),
    projectNotes: getValue("projectNotes"),
    scopeText: currentEstimateItems
      .map((x, i) => {
        return `${i + 1}. ${x.name} (${x.qty} ${x.unit}) - ${money(x.final)}`;
      })
      .join("\n"),
    subtotal: Math.round(t.subtotal),
    discount: Math.round(t.discount),
    total: Math.round(t.total)
  };

  fetch(WEB_APP_URL, {
    method: "POST",
    mode: "no-cors",
    headers: {
      "Content-Type": "text/plain"
    },
    body: JSON.stringify(payload)
  });

  alert("Estimate sent. Check email and Telegram.");
}

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function roundMoneyInput(value) {
      return Math.round((Number(value) || 0) * 100) / 100;
    }
