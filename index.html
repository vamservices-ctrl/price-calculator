<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VAM Services Calculator</title>
<style>
:root{
--bg:#f4f6f8;--card:#fff;--dark:#111827;--muted:#6b7280;--line:#e5e7eb;--green:#ecfdf5;--blue:#eff6ff;--red:#fee2e2;
}
body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:#111827;padding:18px}
.container{max-width:1250px;margin:auto}
.header{background:#111;color:white;padding:24px;border-radius:18px;margin-bottom:18px}
.header h1{margin:0;font-size:30px}
.header p{margin:8px 0 0;color:#cbd5e1}
.card{background:white;border-radius:16px;margin-bottom:14px;box-shadow:0 3px 14px rgba(0,0,0,.08);overflow:hidden}
.title{padding:18px 20px;font-size:21px;font-weight:700;display:flex;justify-content:space-between;cursor:pointer}
.content{display:none;padding:0 18px 18px}
.row{display:grid;grid-template-columns:2.3fr .75fr .65fr .85fr .85fr .85fr 1fr 1fr;gap:8px;align-items:center;border-top:1px solid var(--line);padding:10px 0}
.head{font-size:12px;font-weight:700;color:#4b5563;text-transform:uppercase}
.item-title{font-weight:700}
.item-ru{font-size:12px;color:var(--muted);margin-top:3px}
input,select{width:100%;box-sizing:border-box;border:1px solid #d1d5db;border-radius:8px;padding:9px;font-size:14px;background:white}
.price{font-size:13px;color:#374151}
.sum{font-weight:700}
.total{background:var(--green);border:1px solid #bbf7d0;border-radius:12px;padding:14px;margin-top:14px;font-size:22px;font-weight:800}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.reset{background:#111;color:white;border:0;border-radius:10px;padding:10px 14px;margin:10px 0;cursor:pointer}
@media(max-width:850px){
.row{grid-template-columns:1fr 1fr}
.head{display:none}
}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>VAM Services Price Calculator</h1>
<p>Internal estimating tool. Preliminary pricing only.</p>
</div>
<div id="app"></div>
</div>

<script>
const sections=[
{
id:"painting",title:"🎨 Painting",type:"painting",
items:[
["Interior Painting - Walls & Ceilings","Покраска дома: стены + потолки","SF",2.50,3.00,4.00],
["Interior Painting - Walls Only","Покраска дома: только стены","SF",1.50,2.00,3.00],
["Interior Painting - Ceilings Only","Покраска дома: только потолки","SF",1.00,1.50,2.00],
["Extra Coat / Primer","3-й слой / праймер","SF",0.75,1.00,2.00],
["Interior Door Painting","Покраска двери","Each",100,120,150],
["Door Frame Painting","Покраска дверной коробки","Each",40,60,100],
["Window Sill Painting","Покраска подоконника","Each",25,30,50],
["Window Sill Repair + Painting","Ремонт + покраска подоконника","Each",50,85,125],
["Shelf Painting","Покраска полки","Each",25,30,50],
["Shelf Repair + Painting","Ремонт + покраска полки","Each",50,85,125]
]
},
{id:"exterior",title:"🏠 Exterior Painting",type:"exterior"},
{id:"cabinets",title:"🍽 Cabinet Painting",type:"cabinets"},
{
id:"drywall",title:"🧱 Drywall",type:"drywall",
items:[
["Small Drywall Repair","Небольшой ремонт отверстия","Each",150,200,300],
["Medium Drywall Repair up to 2×2 ft","Средний ремонт до 2×2 ft","Each",250,400,600],
["Leak Damage Drywall Repair","Ремонт после протечки","Each",400,600,800],
["Tape Repair - 10 LF Section","Замена ленты, участок 10 LF","Section",400,600,800],
["Skim Coat - 1 Coat","Skim coat, 1 слой","SF",2,3,4],
["Skim Coat / Level 5 - 2 Coats","Skim coat / Level 5, 2 слоя","SF",4,6,8]
]
},
{
id:"flooring",title:"🪵 Flooring",type:"table",minimum:350,
items:[
["LVP Installation","Укладка LVP / винила","SF",2,2.75,3.5],
["Laminate Installation","Укладка ламината","SF",2.5,3.25,4],
["Engineered Hardwood - Floating","Инженерная доска, плавающая","SF",3,3.75,4.5],
["Engineered Hardwood - Glue Down","Инженерная доска на клей","SF",6,7,9],
["LVP / Laminate Stairs","Ступени LVP / ламинат","Step",75,100,150],
["Engineered Hardwood Stairs","Ступени инженерная доска","Step",100,175,300],
["Carpet Removal","Демонтаж ковра","SF",0.25,0.45,0.75],
["LVP / Laminate Removal","Демонтаж LVP / ламината","SF",0.75,1,1.25],
["Glued Engineered Hardwood Removal","Демонтаж приклеенной инженерной доски","SF",3,4.25,6],
["Floor Leveling - Small Area","Выравнивание пола, маленький участок","Each",200,350,500],
["Floor Leveling - Medium Area","Выравнивание пола, средний участок","Each",500,1000,1500],
["Quarter Round Installation","Установка quarter round","LF",1,1.5,2],
["Transition Strip Installation","Установка переходного порожка","Each",40,50,80]
]
},
{
id:"doors",title:"🚪 Doors & Trim",type:"table",
items:[
["Interior Door Replacement","Замена межкомнатной двери","Each",75,120,160],
["Prehung Door Installation","Установка двери с коробкой","Each",100,150,200],
["Entry Door Installation","Установка входной двери","Each",400,700,1000],
["Baseboard Installation","Установка плинтуса","LF",1.5,2.25,3],
["Baseboard Installation + Painting","Установка + покраска плинтуса","LF",4,5,6],
["Crown Molding Installation","Установка crown molding","LF",2,3,4],
["Crown Molding Installation + Painting","Установка + покраска crown molding","LF",4,6,8],
["Window Trim Installation","Установка оконного trim","LF",2,4,6],
["Window Trim Installation + Painting","Установка + покраска оконного trim","LF",4,6,8]
]
},
{
id:"handyman",title:"🔧 Handyman",type:"table",
items:[
["TV Mount","Установка телевизора","Each",150,200,400],
["Wire Concealment","Скрытие проводов","Each",50,125,200],
["Wall Shelves","Настенные полки","Project",40,80,150],
["Mirror Installation","Монтаж зеркала","Each",75,175,350],
["Picture / Decor Installation","Монтаж картин / декора","Each",25,40,100],
["Ceiling Fan Installation","Потолочный вентилятор","Each",125,175,250],
["Standard Chandelier","Люстра стандартная","Each",100,150,250],
["High Ceiling Chandelier 18–20 ft","Люстра 18–20 ft","Each",300,450,800],
["Light Fixture Replacement","Замена светильника","Each",80,120,200],
["Outlet Replacement","Замена розетки","Each",25,40,60],
["Switch Replacement","Замена выключателя","Each",25,40,60],
["GFCI Outlet Replacement","Замена GFCI розетки","Each",50,75,100],
["Dimmer Switch Replacement","Замена диммера","Each",50,75,100],
["Faucet Replacement","Замена смесителя","Each",125,150,250],
["Kitchen Faucet Replacement","Замена кухонного смесителя","Each",150,250,450],
["Toilet Replacement","Замена унитаза","Each",150,200,350],
["Garbage Disposal Replacement","Замена измельчителя мусора","Each",150,200,300],
["P-Trap Replacement","Замена сифона","Each",100,175,300],
["Bidet Installation","Установка биде","Each",100,175,300],
["Shower Head Replacement","Замена душевой лейки","Each",75,125,200],
["Bathtub Caulking","Герметизация ванны","Each",125,225,400],
["Shower Caulking","Герметизация душевой","Each",150,275,500],
["Blinds Installation","Установка жалюзи","Window",40,50,100],
["Curtain Rod Installation","Установка карниза","Window",75,125,250],
["Window Caulking","Герметизация окна","Window",75,150,300]
]
},
{
id:"fence",title:"🏡 Fence",type:"table",
items:[
["Wood Privacy Fence - 6 ft","Деревянный забор 6 ft","LF",35,50,70],
["Steel Posts Add-on","Доплата за железные столбы","LF",5,10,12],
["Top Cap & Trim","Верхняя корона","LF",8,12,18],
["Old Fence Removal","Демонтаж старого забора","LF",3,5,8],
["Single Gate","Калитка","Each",250,300,500],
["Single Gate - New Frame / Complex","Калитка сложная / новая рама","Each",300,500,700],
["Double Gate","Двустворчатые ворота","Each",400,700,1200],
["Fence Paint / Stain - One Side","Покраска / stain забора, одна сторона","LF",10,12,14],
["Fence Paint / Stain - Two Sides","Покраска / stain забора, две стороны","LF",17.5,21,24.5]
]
},
{
id:"deck",title:"🏡 Deck & Pergola",type:"table",
items:[
["New Wood Deck","Новый деревянный deck","SF",35,50,70],
["New Composite Deck","Новый composite deck","SF",55,70,100],
["Deck Wash","Мойка deck","SF",0.25,0.45,0.75],
["Deck Stain","Морилка deck","SF",1.5,2.5,4],
["Deck Board Replacement","Замена досок deck","LF",15,25,45],
["Small Pergola","Маленькая pergola","Project",2000,3000,4000],
["Medium Pergola","Средняя pergola","Project",4000,6000,8000],
["Large Pergola","Большая pergola","Project",8000,14000,20000]
]
}
];

function money(n){return "$"+Number(n).toLocaleString(undefined,{maximumFractionDigits:0});}
function price(n){return "$"+Number(n).toLocaleString(undefined,{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2});}
function val(level,low,work,high){return level==="low"?low:level==="high"?high:work;}
function toggle(id){let el=document.getElementById(id);el.style.display=el.style.display==="block"?"none":"block";}

function render(){
let app=document.getElementById("app");app.innerHTML="";
sections.forEach(sec=>{
app.innerHTML+=`<div class="card"><div class="title" onclick="toggle('${sec.id}')">${sec.title}<span>+</span></div><div id="${sec.id}" class="content">${section(sec)}</div></div>`;
});
attachDrywall();
}
function section(sec){
if(sec.type==="exterior")return exterior();
if(sec.type==="cabinets")return cabinets();
let html=`<button class="reset" onclick="resetSection('${sec.id}')">Reset This Section</button>
<div class="row head"><div>Description</div><div>Qty</div><div>Unit</div><div>Low</div><div>Working</div><div>High</div><div>Select</div><div>Total</div></div>`;
sec.items.forEach((r,i)=>{
html+=row(sec.id,i,r);
});
html+=`<div class="total" id="${sec.id}_total">Grand Total: $0</div>
<div class="note">Preliminary estimate only. Final price depends on photos, access, materials, and site conditions.</div>`;
if(sec.id==="flooring")html+=`<div class="note"><b>Assistant note:</b> Ask if client wants baseboards, quarter round, and how many transition strips are needed.</div>`;
return html;
}
function row(id,i,r){
return `<div class="row">
<div><div class="item-title">${r[0]}</div><div class="item-ru">${r[1]}</div></div>
<div><input type="number" id="${id}_${i}_qty" value="0" min="0" step="0.01" oninput="calc('${id}')"></div>
<div class="price">${r[2]}</div>
<div class="price">${price(r[3])}</div>
<div class="price">${price(r[4])}</div>
<div class="price">${price(r[5])}</div>
<div><select id="${id}_${i}_level" onchange="calc('${id}')"><option value="working">Working</option><option value="low">Low</option><option value="high">High</option></select></div>
<div class="sum" id="${id}_${i}_sum">$0</div>
</div>`;
}
function calc(id){
let sec=sections.find(s=>s.id===id),total=0;
sec.items.forEach((r,i)=>{
let qty=+document.getElementById(`${id}_${i}_qty`).value||0;
let level=document.getElementById(`${id}_${i}_level`).value;
let line=qty*val(level,r[3],r[4],r[5]);
document.getElementById(`${id}_${i}_sum`).innerText=money(line);
total+=line;
});
if(sec.minimum&&total>0&&total<sec.minimum)total=sec.minimum;
if(id==="drywall"&&total>0&&total<200)total=200;
if(id==="deck"&&total>0&&total<250)total=250;
document.getElementById(`${id}_total`).innerText="Grand Total: "+money(total);
}
function resetSection(id){
document.querySelectorAll(`#${id} input`).forEach(x=>x.value=0);
document.querySelectorAll(`#${id} select`).forEach(x=>x.value="working");
if(id==="exterior")calcExterior();
else if(id==="cabinets")calcCabinets();
else if(id==="drywall")calcDrywall();
else calc(id);
}

/* Painting custom modifier */
function calcPainting(){
calc("painting");
}

/* Drywall volume discount */
function drywallDiscount(qty){if(qty>=10)return .75;if(qty>=6)return .80;if(qty>=3)return .90;return 1;}
function attachDrywall(){
let sec=sections.find(s=>s.id==="drywall");
sec.items.forEach((r,i)=>{
document.getElementById(`drywall_${i}_qty`).setAttribute("oninput","calcDrywall()");
document.getElementById(`drywall_${i}_level`).setAttribute("onchange","calcDrywall()");
});
}
function calcDrywall(){
let sec=sections.find(s=>s.id==="drywall"),total=0;
sec.items.forEach((r,i)=>{
let qty=+document.getElementById(`drywall_${i}_qty`).value||0;
let level=document.getElementById(`drywall_${i}_level`).value;
let p=val(level,r[3],r[4],r[5]);
if(i===0||i===1||i===2)p*=drywallDiscount(qty);
let line=qty*p;
document.getElementById(`drywall_${i}_sum`).innerText=money(line);
total+=line;
});
if(total>0&&total<200)total=200;
document.getElementById("drywall_total").innerText="Grand Total: "+money(total);
}

/* Exterior */
function exterior(){
return `<button class="reset" onclick="resetSection('exterior')">Reset This Section</button>
<div class="row head"><div>Description</div><div>Qty</div><div>Unit</div><div>Low</div><div>Working</div><div>High</div><div>Select</div><div>Total</div></div>
${extRow("Partial Brick / Partial Siding House","Дом частично кирпич / частично сайдинг","Project",2500,4000,6000,"partial")}
${extRow("Full Siding House","Дом полностью из сайдинга","Project",3500,5000,7000,"siding")}
${extPct("Two-Story Add-on","Доплата за второй этаж",15,20,30,"twostory")}
${extPct("Second Color Add-on","Доплата за второй цвет / trim color",15,20,30,"color")}
${extPct("Brick Painting Add-on","Доплата за покраску кирпича",20,35,50,"brick")}
${extRow("Foundation Painting","Покраска фундамента","Project",300,600,1200,"foundation")}
${extRow("Downspout Painting","Покраска сливной трубы","Each",80,120,150,"downspout")}
${extRow("Exterior Repair Area","Ремонт наружного участка","Each Repair Area",100,150,250,"repair")}
<div class="total" id="exterior_total">Grand Total: $0</div>
<div class="note">Pressure washing is included in exterior painting base price. Gutters are included with trim unless specified separately.</div>`;
}
function extRow(en,ru,unit,low,work,high,key){
return `<div class="row"><div><div class="item-title">${en}</div><div class="item-ru">${ru}</div></div>
<div><input type="number" id="ext_${key}_qty" value="0" min="0" step="1" oninput="calcExterior()"></div>
<div class="price">${unit}</div><div class="price">${price(low)}</div><div class="price">${price(work)}</div><div class="price">${price(high)}</div>
<div><select id="ext_${key}_level" onchange="calcExterior()"><option value="working">Working</option><option value="low">Low</option><option value="high">High</option></select></div>
<div class="sum" id="ext_${key}_sum">$0</div></div>`;
}
function extPct(en,ru,low,work,high,key){
return `<div class="row"><div><div class="item-title">${en}</div><div class="item-ru">${ru}</div></div>
<div><input type="number" id="ext_${key}_qty" value="0" min="0" step="1" oninput="calcExterior()"></div>
<div class="price">%</div><div class="price">${low}%</div><div class="price">${work}%</div><div class="price">${high}%</div>
<div><select id="ext_${key}_level" onchange="calcExterior()"><option value="working">Working</option><option value="low">Low</option><option value="high">High</option></select></div>
<div class="sum" id="ext_${key}_sum">$0</div></div>`;
}
function calcExterior(){
let base=0,total=0;
[["partial",2500,4000,6000],["siding",3500,5000,7000]].forEach(r=>{
let q=+document.getElementById(`ext_${r[0]}_qty`).value||0,l=document.getElementById(`ext_${r[0]}_level`).value,line=q*val(l,r[1],r[2],r[3]);
document.getElementById(`ext_${r[0]}_sum`).innerText=money(line);base+=line;
});
total=base;
[["twostory",.15,.20,.30],["color",.15,.20,.30],["brick",.20,.35,.50]].forEach(r=>{
let q=+document.getElementById(`ext_${r[0]}_qty`).value||0,l=document.getElementById(`ext_${r[0]}_level`).value,line=q>0?base*val(l,r[1],r[2],r[3]):0;
document.getElementById(`ext_${r[0]}_sum`).innerText=money(line);total+=line;
});
[["foundation",300,600,1200],["downspout",80,120,150],["repair",100,150,250]].forEach(r=>{
let q=+document.getElementById(`ext_${r[0]}_qty`).value||0,l=document.getElementById(`ext_${r[0]}_level`).value,line=q*val(l,r[1],r[2],r[3]);
document.getElementById(`ext_${r[0]}_sum`).innerText=money(line);total+=line;
});
document.getElementById("exterior_total").innerText="Grand Total: "+money(total);
}

/* Cabinets */
function cabinets(){
return `<button class="reset" onclick="resetSection('cabinets')">Reset This Section</button>
<div class="row head"><div>Description</div><div>Qty</div><div>Unit</div><div>Low</div><div>Working</div><div>High</div><div>Select</div><div>Total</div></div>
${cabRow(0,"Cabinet Doors","Дверцы шкафов","Each",60,90,135)}
${cabRow(1,"Drawers","Ящики","Each",50,70,110)}
${cabPct("Cabinet Frames","Фреймы шкафов, процент от дверей + ящиков",25,30,40,"frame")}
${cabPct("Sanding Add-on","Шлифовка шкафов",10,15,25,"sand")}
${cabPct("Caulking / Sealing Add-on","Герметик / caulking",5,10,15,"caulk")}
${cabFixed("Cabinet / Drawer Repair","Ремонт фасадов / ящиков / шпаклевка","Each",25,50,100,"repair")}
<div class="total" id="cabinets_total">Grand Total: $0</div>
<div class="note">Frames, sanding, and caulking are calculated from cabinet doors + drawers subtotal. Minimum cabinet project: $1,500.</div>`;
}
function cabRow(i,en,ru,unit,low,work,high){
return `<div class="row"><div><div class="item-title">${en}</div><div class="item-ru">${ru}</div></div>
<div><input type="number" id="cab_${i}_qty" value="0" min="0" step="1" oninput="calcCabinets()"></div><div class="price">${unit}</div>
<div class="price">${price(low)}</div><div class="price">${price(work)}</div><div class="price">${price(high)}</div>
<div><select id="cab_${i}_level" onchange="calcCabinets()"><option value="working">Working</option><option value="low">Low</option><option value="high">High</option></select></div>
<div class="sum" id="cab_${i}_sum">$0</div></div>`;
}
function cabPct(en,ru,low,work,high,key){
return `<div class="row"><div><div class="item-title">${en}</div><div class="item-ru">${ru}</div></div>
<div><input type="number" id="cab_${key}_qty" value="0" min="0" step="1" oninput="calcCabinets()"></div><div class="price">%</div>
<div class="price">${low}%</div><div class="price">${work}%</div><div class="price">${high}%</div>
<div><select id="cab_${key}_level" onchange="calcCabinets()"><option value="working">Working</option><option value="low">Low</option><option value="high">High</option></select></div>
<div class="sum" id="cab_${key}_sum">$0</div></div>`;
}
function cabFixed(en,ru,unit,low,work,high,key){
return `<div class="row"><div><div class="item-title">${en}</div><div class="item-ru">${ru}</div></div>
<div><input type="number" id="cab_${key}_qty" value="0" min="0" step="1" oninput="calcCabinets()"></div><div class="price">${unit}</div>
<div class="price">${price(low)}</div><div class="price">${price(work)}</div><div class="price">${price(high)}</div>
<div><select id="cab_${key}_level" onchange="calcCabinets()"><option value="working">Working</option><option value="low">Low</option><option value="high">High</option></select></div>
<div class="sum" id="cab_${key}_sum">$0</div></div>`;
}
function calcCabinets(){
let base=0;
[[0,60,90,135],[1,50,70,110]].forEach(r=>{
let q=+document.getElementById(`cab_${r[0]}_qty`).value||0,l=document.getElementById(`cab_${r[0]}_level`).value,line=q*val(l,r[1],r[2],r[3]);
document.getElementById(`cab_${r[0]}_sum`).innerText=money(line);base+=line;
});
let total=base;
[["frame",.25,.30,.40],["sand",.10,.15,.25],["caulk",.05,.10,.15]].forEach(r=>{
let q=+document.getElementById(`cab_${r[0]}_qty`).value||0,l=document.getElementById(`cab_${r[0]}_level`).value,line=q>0?base*val(l,r[1],r[2],r[3]):0;
document.getElementById(`cab_${r[0]}_sum`).innerText=money(line);total+=line;
});
let rq=+document.getElementById("cab_repair_qty").value||0,rl=document.getElementById("cab_repair_level").value,rt=rq*val(rl,25,50,100);
document.getElementById("cab_repair_sum").innerText=money(rt);total+=rt;
if(total>0&&total<1500)total=1500;
document.getElementById("cabinets_total").innerText="Grand Total: "+money(total);
}

render();
</script>
</body>
</html>
